<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="t d">
  <title id="t">Deprecated - kept for those who still use it</title>
  <desc id="d">An empty nest on a bare branch at dusk while a bird flies off toward the sunset, beside the words Deprecated, kept for those who still use it, security fixes only.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dbe3"/>
      <stop offset="1" stop-color="#b3b0bf"/>
    </linearGradient>
    <clipPath id="card"><rect width="640" height="160" rx="18"/></clipPath>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#5c5c66"/>
      <rect x="12" width="12" height="24" fill="#9a98a6"/>
    </pattern>
  </defs>
  <g clip-path="url(#card)">
    <rect width="640" height="160" fill="url(#sky)"/>
    <!-- the setting sun -->
    <circle cx="170" cy="150" r="44" fill="#e8a87c" opacity="0.6"/>
    <!-- the bare branch -->
    <path d="M10 112 C 50 106, 100 108, 150 102" stroke="#5a4636" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M116 106 l 16 -18 M60 108 l -10 -16" stroke="#5a4636" stroke-width="4" stroke-linecap="round"/>
    <!-- the empty nest -->
    <path d="M40 104 C 44 124, 104 124, 108 104 Z" fill="#8a7a6a"/>
    <path d="M44 108 C 60 113, 88 113, 104 108" stroke="#6a5a4a" stroke-width="3" fill="none"/>
    <!-- the bird flying off -->
    <g transform="translate(160 46)" fill="#5c5c66">
      <path d="M0 6 C 8 -6, 16 -6, 22 4 C 28 -6, 36 -6, 44 6 C 36 2, 28 4, 22 10 C 16 4, 8 2, 0 6 Z"/>
    </g>
    <g transform="translate(196 26) scale(0.6)" fill="#6e6e78">
      <path d="M0 6 C 8 -6, 16 -6, 22 4 C 28 -6, 36 -6, 44 6 C 36 2, 28 4, 22 10 C 16 4, 8 2, 0 6 Z"/>
    </g>
    <!-- the words -->
    <text x="232" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="2" fill="#3a3a44">DEPRECATED</text>
    <text x="234" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#5a4636">Kept for those who still use it</text>
    <text x="234" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4a4a4a">Security fixes only - its README names what replaces it</text>
    <!-- the closing tape -->
    <rect y="144" width="640" height="16" fill="url(#stripes)"/>
  </g>
  <rect x="1" y="1" width="638" height="158" rx="17" fill="none" stroke="#6e6e78" stroke-width="2"/>
</svg>
