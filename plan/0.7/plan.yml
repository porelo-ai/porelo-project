# The plan of release 0.7. Issue states are not written here: they are read from each repository's index.
release: "0.7"
goal: "A developer starts in a repository they already have, led by the Porelo Wizard"
sprints:
  - id: "1"
    title: "Starting in one's own repository"
    goal: "A developer starts in a repository they already have, with no project written and no flags to learn."
    functions:
      - title: "Work without a project, with plain refusals"
        test: "A task starts in a checkout in `default`; a followed project naming the repository is offered to take it; a repository with no commit, an unreadable upstream or a failed fetch is named as what it is, with the next step."
        issues: [porelo-project#PJ14, porelo#B229, porelo#B33, porelo-frontend#F118]
      - title: "The agent already on the machine is taken"
        test: "Without `--agent` and `--provider` the task starts with the Claude Code signed in there and says what it found and where; the interface shows the same choice."
        issues: [porelo-project#PJ53, porelo#B225, porelo-claude-code#CC36, porelo#B224, porelo-frontend#F143]
      - title: "Keys and providers without stumbling"
        test: "A key pasted at `vault put` is read whole; an agent given a provider it does not know is refused before the start."
        issues: [porelo#B228, porelo#P09]
  - id: "1a"
    title: "Connections finish or say why they failed"
    goal: "A first connection has a clear loading state and a bounded wait."
    functions:
      - title: "Load, time out and forget one connection"
        test: "Load a page for the first time and open a rarely used connection action; both show the same loading state. Connect a server that accepts but never answers; the call ends with a named timeout. Forget one connection; the others remain."
        issues: [porelo#B200, porelo-frontend#F91, porelo-frontend#F93]
  - id: "1b"
    title: "Tell work from rest"
    goal: "The terminal and task card agree about what the agent is doing."
    functions:
      - title: "An agent shown working, resting or waiting"
        test: "Attach to an agent, let it work, rest and wait, and compare the CLI with the task card. Both show the same state; rest must not appear as ongoing work. Check the Pi activity path too."
        issues: [porelo#B118, porelo-frontend#F99, porelo-pi#PI33]
  - id: "1c"
    title: "Choose the right existing sign-in"
    goal: "An imported sign-in belongs to the provider the person selected."
    functions:
      - title: "Import one provider and recognize OMP"
        test: "Sign Pi in to two providers, import the chosen provider and start a task; the other sign-in must not be selected. Detect OMP through agent.db and import its SQLite sign-in. An undetermined sign-in must be shown as unknown."
        issues: [porelo#B226, porelo-pi#PI36, porelo-omp#OM32, porelo-omp#OM33]
  - id: "1d"
    title: "Installed agents fit the start"
    goal: "Package compatibility and command options say what they actually do."
    functions:
      - title: "Refuse an incompatible protocol and a meaningless option"
        test: "Install compatible and too-old core packages with the agent; only an incompatible protocol version is refused. Exercise the defined behavior of --now, or confirm its removal is explained; it must never be accepted without an effect."
        issues: [porelo#B230, porelo-claude-code#CC22, porelo#B201]
  - id: "1e"
    title: "Use a provider that fits"
    goal: "A supported wire format works even when the agent does not already know the provider."
    functions:
      - title: "Start local, organization and added providers"
        test: "Use a loopback provider, an organization HTTPS provider, xAI, Zhipu and Z.AI. A supported dialect works; an unsupported dialect and HTTP outside loopback are refused before the start."
        issues: [porelo#P10, porelo#B149, porelo#P07, porelo#P08]
  - id: "1f"
    title: "Deliver to the chosen branch"
    goal: "The person chooses where the approved work goes."
    functions:
      - title: "The chosen branch receives the work"
        test: "Choose a branch template or an explicit branch, approve the work and read the result on GitHub. Only the chosen branch receives it; an existing online branch belonging to someone else is refused."
        issues: [porelo#B190, porelo-frontend#F97]
  - id: "1g"
    title: "Explain a refused delivery"
    goal: "A delivery failure stays visible and says what the person can do."
    functions:
      - title: "A failed delivery named and kept visible"
        test: "Make the forge stop answering and trigger other delivery refusals. Each answer ends within the configured bound with a distinct reason code; the error remains visible. The card names its repository, and a project push made by the person is picked up."
        issues: [porelo#B179, porelo#B197, porelo-frontend#F117]
  - id: "2"
    title: "A project proposed from the checkout"
    goal: "Whoever needs more than the default image or `default` gets drafts from what the checkout already says."
    functions:
      - title: "`porelo project init` proposes tools and rules"
        test: "For a Maven repository, a `.porelo.yml` and where needed a `project.yml` draft, each value with its source; a project kept in a local repository is read again at `refresh`."
        issues: [porelo-project#PJ52, porelo#B220, porelo#B221, porelo#B227]
        notes: ["porelo-ecosystems, a new repository and agent, Maven first"]
      - title: "The drafts shown before the first task"
        test: "At the first start in `default`, the interface shows what the machine proposes, to take or leave."
        issues: [porelo-frontend#F142]
      - title: "A company's private package repository, with no credential in the task"
        test: "A task builds against an authenticated Nexus or Artifactory; `settings.xml` is written at the start and the credential stays in the vault."
        issues: [porelo#B222, porelo#B219]
  - id: "3"
    title: "The Porelo Wizard leads"
    goal: "One way from an empty machine to the first reviewed work; the steps of sprints 1 and 2 become steps of its catalogue."
    functions:
      - title: "Questions, a plan, and taken up again"
        test: "The questions first, the whole plan shown before anything runs, and after a pause it goes on where the person was; a step done elsewhere counts as done."
        issues: [porelo-project#PJ57]
        notes: ["porelo-wizard, a new repository", "the catalogue of steps", "the checks porelo still lacks"]
      - title: "A step for someone else handed over"
        test: "A step for an administrator comes as instructions and as a file to run; the wizard waits for its check."
        notes: ["hand-overs in the wizard"]
  - id: "3a"
    title: "Use the terminal beside a live task list"
    goal: "The person can type normally and follow tasks as their states change."
    functions:
      - title: "A terminal and live list used together"
        test: "Use the embedded terminal as an ordinary terminal and open task list --watch beside it. States and the clearance hint update. Input reaches the task whole and unchanged; Ctrl-C restores the terminal."
        issues: [porelo-frontend#F105, porelo#B48]
  - id: "4"
    title: "A chat beside the wizard, and a run with nobody there"
    goal: "Questions about the current step, and the same plan for many machines."
    functions:
      - title: "A chat answers questions about the current step"
        test: "Beside the wizard, with the Claude Code already signed in on the machine; it never sees a secret and runs nothing unconfirmed."
        notes: ["the chat on flutter_ai_toolkit", "the chat's Claude Code provider"]
      - title: "The same plan from a file of answers"
        test: "The wizard runs with nobody there for many machines; a step that needs a person stops it and says so."
        notes: ["a run from a file of answers"]
