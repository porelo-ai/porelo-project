# The plan of release 0.6. Issue states are not written here: they are read from each repository's index.
release: "0.6"
goal: "Porelo is built in Porelo tasks"
sprints:
  - id: "1"
    title: "An agent works on the rented host"
    goal: "No local forge, pool or room yet; the task follows the central forge as today."
    functions:
      - title: "The host rented and given back at one command"
        test: "`porelo-host up porelo` rents from Scaleway and sets it up; the operator reaches it only through the VPN with the drive mounted; `down` leaves nothing at the provider."
        tested: "2026-10-23"
        issues: [porelo-frontend#F131, porelo-frontend#F132, porelo-frontend#F134, porelo-host#HO09, porelo-host#HO05, porelo-host#HO06, porelo-host#HO02]
      - title: "Claude works in a task, signed in with the operator's subscription"
        test: "Signed in by hand at the stop; the task holds only a short-lived token and no memory of the agent's own; Sluice answers a read-only question in its task."
        tested: "2026-10-23"
        issues: [porelo-claude-code#CC30, porelo-claude-code#CC24, porelo#B255, porelo-message-sluice#SL29]
      - title: "Each repository brings its image, and each task its values"
        test: "The task starts with `issue` and `phase`; its image is made from the repository's `porelo.yml`; `pruefung-b189-b192.sh` passes."
        tested: "2026-10-23"
        issues: [porelo#B189, porelo#B192]
  - id: "2"
    title: "The host from the interface, the agents in the room"
    goal: "The operator works the host without a terminal, and the agents talk in the project's room."
    functions:
      - title: "The host up and down from the interface, then a task started there"
        test: "*Put on a server* shows the steps and asks at the stop for the drive's login and the vault's passphrase; it writes the machine file and the host's VPN key into the drive and offers the tunnel as a file; a task started on the host signs its agent in on the way."
        tested: "2026-10-23"
        issues: [porelo-frontend#F135, porelo-frontend#F140, porelo-frontend#F141, porelo-host#HO19, porelo-host#HO10, porelo#B258, porelo#B261, porelo-host#HO18, porelo-frontend#F151]
      - title: "Two agents talk in the room, and a message wakes the resting one"
        test: "Two tasks on the host write to each other in the project's room; the operator reads along through the VPN; a message naming a resting agent wakes it."
        tested: "2026-10-23"
        issues: [porelo-host#HO11, porelo-message-matrix#MX12, porelo-message-matrix#MX31, porelo-message-matrix#MX32, porelo-message-matrix#MX33, porelo#B259]
  - id: "2b"
    title: "The release plan as a page"
    goal: "This page, made from a checked-in plan file and readable on the central forge."
    functions:
      - title: "The plan page made from the plan file"
        test: "`plan/0.6.md` shows the same sprints, functions, states and marks as the local page; `plan check` finds a planted fault."
        tested: "2026-10-24"
        issues: [porelo-project#PJ63, porelo-buildtools#BT26]
      - title: "The release plan page drawn as the local one"
        test: "The page made from the plan shows each sprint's bar by its issues' states, coloured chips per issue and a mark per function, as the local page does, drawn as SVG so the central forge shows it too; every text in it is escaped."
        tested: "2026-10-24"
        issues: [porelo-buildtools#BT27, porelo-buildtools#BT29]
      - title: "A parent issue shown apart from the issues that carry its work"
        test: "A parent with no work of its own stands as one line under its function with its state, never as a chip or in a bar; `plan check` refuses a parent behind its parts."
        tested: "2026-10-24"
        issues: [porelo-buildtools#BT31]
  - id: "2c"
    title: "The host flow anew"
    goal: "Putting a project on a server, walked first against stand-ins: no locked screen, no secret in a form, every step in words, and the person's own steps offered by the interface."
    functions:
      - title: "The host flow walked against stand-ins"
        test: "In a development build against the stand-in porelo-host, the operator walks up and down: the host stands in Machines while it is prepared, each step in words with the time left, a stop shown as needs you, down from the host's own menu with no field typed again; a refused start names its cause in words."
        tested: "2026-10-24"
        issues: [porelo-frontend#F162, porelo-frontend#F164, porelo-frontend#F154, porelo-frontend#F155, porelo-frontend#F156, porelo-host#HO21, porelo-frontend#F161, porelo#B268, porelo-message-matrix#MX37, porelo#B265, porelo#B267]
      - title: "Secrets only in a terminal, by the provider's own login"
        test: "At the host's stop a terminal opens with Tresorit's own login, the code asked after the password; the vault's passphrase is typed there; the forge is reached with the person's token from GitHub's device-code login, and no deploy key is made; Ctrl+Shift+V pastes in every terminal of the interface."
        tested: "2026-10-24"
        issues: [porelo-frontend#F152, porelo-frontend#F153, porelo-frontend#F160, porelo#B269]
        covers: [porelo-project#PJ69]
      - title: "The person's own steps offered, the room without handwork"
        test: "The interface offers the VPN, joining the room and its tunnel as terminals with the command filled in; the room shows no helper account, or one that answers what it is; needs-you rows name their machine and their way out, and stay readable when resolved; work starts from a visible button."
        tested: "2026-10-24"
        issues: [porelo-frontend#F157, porelo-frontend#F158, porelo-frontend#F159, porelo-frontend#F165, porelo-message-matrix#MX35, porelo#B264, porelo#B273]
      - title: "A rented host with the new flow"
        test: "On a rented host of 32 threads, the whole flow from the interface: the collection comes with porelo-host, its digest checked; the room's homeserver starts with no hand fix; two tasks talk; down leaves nothing at the provider."
        tested: "2026-10-24"
        issues: [porelo-message-matrix#MX34, porelo-host#HO13, porelo-buildtools#BT28, porelo-frontend#F163]
  - id: "2d"
    title: "The host flow without stumbling"
    goal: "The findings of the rented-host test of 2c: nothing typed that Porelo can know, the stop and the VPN in one flow, every state said in words."
    functions:
      - title: "Nothing asked that Porelo can know"
        test: "The wizard writes the project's bundle itself and asks for no path on the server; the public key is filled from the private one; the summary names the project."
        tested: "2026-10-25"
        issues: [porelo-frontend#F167]
      - title: "The stop and the VPN in one flow"
        test: "At the stop a small dialog asks for the Tresorit e-mail and opens the terminal; a mistyped password is asked again in place; the VPN comes up as the setup's last step with only the sudo password, its handshake checked, and only then the server is ready."
        tested: "2026-10-25"
        issues: [porelo-frontend#F171, porelo-host#HO25, porelo-frontend#F172]
      - title: "A setup that survives a restart, told in times and words"
        test: "Closing the interface during a setup warns; after a restart the server stands under Machines in preparation and goes on or comes down; each step shows its start and duration, an overrun step says so in words, no raw lines."
        tested: "2026-10-25"
        issues: [porelo-frontend#F169, porelo-frontend#F170]
      - title: "Room, task and vault said in words"
        test: "The room is joined from the project's page with numbered steps for Element; a running task says whether its agent works, waits or ended, with a leave button; the locked-vault row names this computer's vault and the project, with a button to unlock and to stop following."
        tested: "2026-10-25"
        issues: [porelo-frontend#F174, porelo-frontend#F175, porelo#B277, porelo-frontend#F168, porelo#B276]
      - title: "Buttons that read as buttons"
        test: "The project page's actions are equal tiles in the style the operator picked; giving the server back is confirmed by its consequences."
        tested: "2026-10-25"
        issues: [porelo-frontend#F173, porelo-frontend#F176]
  - id: "2e"
    title: "The host flow without stumbling, part 2"
    goal: "The findings of the rented-host test of 2d: a run that survives the interface, one protocol, the VPN and the key that say their state."
    functions:
      - title: "A setup run once, kept and found again"
        test: "Closing the interface ends or keeps its setup in words; after a restart a running setup is found, an interrupted one shows in Needs you with Go on; a second run of one project is refused; the protocol stays until the give-back, in one list."
        tested: "2026-10-25"
        issues: [porelo-frontend#F180, porelo-frontend#F179, porelo-frontend#F178, porelo-frontend#F181]
      - title: "The key, the VPN and the counts say their state"
        test: "A Scaleway key is checked when stored and in the wizard's first step; one VPN tile follows the tunnel; no NetworkManager popup; the give-back takes this computer's tunnel down; every menu count equals its list."
        tested: "2026-10-25"
        issues: [porelo-frontend#F186, porelo-frontend#F177, porelo-frontend#F182, porelo-frontend#F183, porelo-frontend#F185, porelo#B279, porelo#B280]
      - title: "Who is in the project's room"
        test: "The messages page lists the room's accounts with Remove, and offers a new password to one already in."
        tested: "2026-10-25"
        issues: [porelo-frontend#F184, porelo#B278, porelo-message-matrix#MX40]
  - id: "2f"
    title: "Lists and tiles"
    goal: "Every list a column of even rows that expand, Needs you without pink, the machine page as tiles."
    functions:
      - title: "Even rows that expand, Needs you without pink"
        test: "Projects, Forges, Machines and Needs you show single-line rows of one height; the arrow expands in place, a click opens the detail; Needs you has its action in the row and no pink surface."
        tested: "2026-10-25"
        issues: [porelo-frontend#F187, porelo-frontend#F188]
      - title: "The machine page as tiles"
        test: "The machine's actions stand in the project page's grid with one icon each; taking the server down stands apart in red."
        tested: "2026-10-25"
        issues: [porelo-frontend#F189]
  - id: "3"
    title: "The build servers read"
    goal: "A build server asked from the command line, GitHub and Forgejo alike."
    functions:
      - title: "A build server asked from the command line"
        test: "`porelo build status --project=<project> --repository=<repository> --branch=main` shows the commit, the verdict, the jobs and a red job's log, on GitHub."
        tested: "2026-10-25"
        issues: [porelo#B256]
      - title: "The same command reads Forgejo"
        test: "Against a Forgejo run in podman, the same answer in the same shape."
        tested: "2026-10-25"
        issues: [porelo-adapters#GH07, porelo#B275]
      - title: "Both adapters pass one contract suite"
        test: "Every case from recorded answers; an adapter broken on purpose fails it."
        tested: "2026-10-25"
        issues: [porelo#B253, porelo-adapters#GH06]
        covers: [porelo-project#PJ62]
  - id: "4"
    title: "The local forge builds as the central one"
    goal: "Forgejo, its registry and the test machines on the host; one repository builds there unchanged."
    functions:
      - title: "Forgejo with its registry, a task fetching a snapshot by name"
        test: "The operator opens Forgejo through the VPN; a task reaches its registry by a declared name on 443 and fetches a snapshot, and reaches nothing else on the host."
        tested: "2026-10-26"
        issues: [porelo-host#HO08, porelo-host#HO17, porelo#B233, porelo#B234, porelo-host#HO20, porelo#B266, porelo-host#HO26]
      - title: "Sluice green on both forges on the same commit"
        test: "The same `build.yml` of porelo-message-sluice runs green on Forgejo and on the central forge."
        tested: "2026-10-26"
        issues: [porelo-project#PJ60, porelo#B285, porelo-buildtools#BT32, porelo-message-sluice#SL33]
  - id: "4a"
    title: "Trust the local build"
    goal: "A local build checks its commits and reuses only results that still apply."
    functions:
      - title: "The commit checked and a proven build reused"
        test: "Check a valid and an invalid commit locally and in the build; the invalid one is refused by name. Change only Actions and confirm no full Build starts. Reuse fresh legs for the same tree; a different tree or an old result must be refused."
        issues: [porelo-buildtools#BT17, porelo-buildtools#BT34, porelo-buildtools#BT13, porelo-claude-code#CC34, porelo-pi#PI31]
  - id: "4b"
    title: "Receive the test machine requested"
    goal: "A run asking for IPv4 alone gets exactly that."
    functions:
      - title: "One primary IPv4 and no IPv6"
        test: "Rent an IPv4-only leg machine and read the provider inventory; it shows exactly one primary IPv4 and no IPv6. Return the machine and confirm its resources are gone."
        issues: [porelo-buildtools#BT10]
  - id: "4c"
    title: "A dry run says what will be refused"
    goal: "The person sees an agent refusing a host before starting the task."
    functions:
      - title: "A refused host shown as refused"
        test: "Run task start with --dry-run for an allowed host and one the agent refuses; the latter is named as refused and is refused again by the running task."
        issues: [porelo#B235]
  - id: "5"
    title: "From the task's push to the central forge, after approval"
    goal: "The whole way of a piece of work, shown on porelo-message-sluice."
    functions:
      - title: "The task hears its build from Forgejo"
        test: "The task pushes through its gate to `porelo/<task>` on Forgejo, which builds it; the verdict and a red job's log are in the task's `/porelo/files`."
        issues: [porelo-project#PJ61, porelo-adapters#GH08, porelo#B286, porelo-host#HO31]
      - title: "Only the operator's approval brings the work to the central forge"
        test: "Nothing is there before the approval, the gathered push brings it after; with the project `offline` the push reaches no forge."
        issues: [porelo-host#HO29, porelo-host#HO32, porelo-project#PJ37]
  - id: "6"
    title: "The move, first wave"
    goal: "Each agent works its own move issue inside its new task to Review; the others work as today."
    functions:
      - title: "Sluice works wholly in its task"
        test: "Its move issue reaches Review inside the task with Forgejo's build green; it is reached in the room."
        issues: [porelo-project#PJ59, porelo-frontend#F148]
        notes: ["Sluice's move issue"]
      - title: "Smith in its task, with snapshots of porelo from the registry"
        test: "Smith's three repositories build on Forgejo and take porelo from the local registry."
        issues: [porelo-pi#PI21]
        notes: ["Smith's move issue", "PJ60 issues for the three repositories"]
      - title: "AGY and Codex in their tasks, their sub-agents signed in"
        test: "Antigravity with the operator's Google subscription and Codex CLI with its sign-in, both from the vault."
        issues: [porelo#P12, porelo-agy#AG01, porelo-codex#CX01, porelo#B272, porelo-codex#CX02]
        notes: ["AGY's move issue", "Codex's move issue"]
  - id: "6a"
    title: "Use the ChatGPT sign-in"
    goal: "A Codex task works through the sign-in kept by the host."
    functions:
      - title: "Codex answers without holding real tokens"
        test: "Start a Codex task with the ChatGPT sign-in and ask it a question. Search the container for the real tokens; none are present. Interrupt a refresh after rotation and resume; the new refresh token must still work."
        issues: [porelo#P11]
  - id: "6b"
    title: "Messages keep their text"
    goal: "A message with non-ASCII text reaches the program whole."
    functions:
      - title: "Non-ASCII arguments and paths arrive whole"
        test: "Send a room message and use a path containing non-ASCII characters through each launched program; the recipient sees exactly the text sent, without replacement characters or missing bytes."
        issues: [porelo#B215]
  - id: "6c"
    title: "A repeated tool failure ends the test run"
    goal: "The task acceptance run stops a loop even when the agent redraws its screen."
    functions:
      - title: "A compact failure loop stopped"
        test: "Run an acceptance scenario with an agent that redraws a compact view and repeats a failed tool call; the loop watch stops it before the scenario bound and names the repeated failure. A progressing scenario must continue."
        issues: [porelo#B244]
  - id: "7"
    title: "The move, second wave: the other toolchains"
    goal: "Gradle and Flutter move."
    functions:
      - title: "Matrix in its task"
        test: "Its move issue reaches Review inside the task with Forgejo's build green."
        notes: ["Matrix's move issue", "PJ60 issue for porelo-message-matrix"]
      - title: "IntelliJ and Frontend in their tasks"
        test: "Gradle and Flutter build on Forgejo; the Windows job runs centrally only, named by a variable."
        notes: ["IntelliJ's move issue", "Frontend's move issue", "PJ60 issues for the three repositories"]
      - title: "Test machines by kind from the VM pool"
        test: "porelo-frontend's leased leg asks for the kind `amd64` on Forgejo and gets an account of the pool, reset afterwards, and a rented machine on the central forge; no workflow names a provider."
        issues: [porelo-host#HO12, porelo-buildtools#BT24, porelo-buildtools#BT25]
        notes: ["The pool taken by the same call on Forgejo"]
  - id: "7a"
    title: "The website and IntelliJ work in the task"
    goal: "The website builds and a person reviews waiting work from IntelliJ."
    functions:
      - title: "Build the website and review in IntelliJ"
        test: "Run the full website check inside its task; it passes after the Debian-image and repository-name blockers are fixed. In IntelliJ read a waiting push, approve the displayed commit and reject another with a reason. A new push appears within the stated seconds; approval of the old commit is refused."
        issues: [porelo-ai.github.io#SI05, porelo-intellij#IJ01, porelo-intellij#IJ02]
  - id: "8"
    title: "The move, last wave"
    goal: "Core with a way back, then the coordinator."
    functions:
      - title: "Core in its task, with a way back"
        test: "Core builds porelo in a task, and works on the host again if a fault in Porelo stops it."
        notes: ["Core's move issue", "PJ60 issue for porelo"]
      - title: "The coordinator reads everything and changes only porelo-project"
        test: "In `porelo-all` every repository is there; a change outside `porelo-project/` is refused."
        issues: [porelo-project#PJ58]
  - id: "9"
    title: "Clearing up and counting"
    goal: "What the move leaves behind, and what it makes measurable."
    functions:
      - title: "No channel file and no hand-over directory any more"
        test: "Every `AGENTS.md` describes Matrix, Forgejo and the gate; the channel file, the hand-over directory and the agents' own VM accounts are gone."
        notes: ["every repository's AGENTS.md rewritten"]
      - title: "Machines asked for by kind only"
        test: "A call to `porelo-machines` naming a provider or a server type is refused, naming the kind to ask for; no workflow or build file of any repository names one."
        notes: ["removing BT25's compatible provider call in porelo-buildtools, after every repository's PJ60 issue"]
      - title: "The room and the usage records outlive the host"
        test: "After `down` and a new `up` the room is there with its messages, and so are the records."
        issues: [porelo-message-matrix#MX24, porelo-message-matrix#MX36, porelo-host#HO07, porelo#B231]
        covers: [porelo-project#PJ45]
      - title: "The tokens counted per task, the dependencies shared"
        test: "Each issue shows what its tasks spent; a second Maven build downloads nothing again."
        issues: [porelo#B148, porelo-project#PJ38, porelo#B193]
      - title: "An unfollow leaves nothing of the project"
        test: "After `porelo project unfollow`, `porelo prune` finds nothing of the project left: no clone, no build lock, no upstream copy."
        issues: [porelo#B238]
  - id: "9a"
    title: "The host collection is checked before use"
    goal: "The host setup refuses a collection whose contents changed."
    functions:
      - title: "A changed collection refused"
        test: "Install the host collection through the interface, then offer a changed collection tarball with the original digest; installation is refused before its contents run."
        issues: [porelo-frontend#F137]
  - id: "10"
    title: "Accept the published tools"
    goal: "The release is installed from its publication channel and its dependencies are checked."
    functions:
      - title: "A published release installed and verified"
        test: "Publish and pin Buildtools 0.5.1, then build IntelliJ from an empty Gradle home. Change a dependency digest; the build must fail. Install the release leg from its publication channel; a wrong channel or a candidate must be refused as proof of the tested release."
        issues: [porelo-intellij#IJ09, porelo-buildtools#BT01]
  - id: "11"
    title: "Check the whole move"
    goal: "The setup and move are judged against their full parent criteria."
    functions:
      - title: "The setup, move and recovery proven together"
        test: "Bring up the project, run the local builds, move each agent and restore the room and usage after giving the host back. Compare the results with every setup and move criterion; a missing local-build or recovery prerequisite keeps the parent acceptance open."
        issues: [porelo-project#PJ40, porelo-project#PJ39]
        notes: ["Parent acceptance only; the work is carried by the setup, build, move and recovery functions. Parent acceptance remains open until the complete one-build proof in release 0.19 and the recovery prerequisites pass."]
