# The work each working state stands for, read by porelo-planner: the states work starts from, where success leads
# (then: the next working state, else done), where a reading's blocking findings lead (blocked), one task per story or
# per repository, the modes a task may start in, the order the task is given ({story}, {issues} and {tasks} filled in)
# and the model per agent. Modes and models are proposals: the first mode and the first agent's model are preselected
# in the task dialog, where the person may change them, and a task that starts by itself takes them. A working state
# is a key here.
work:
  In analysis:
    from: [Idea, Accepted]
    done: Analyzed
    per: repository
    modes: [UNATTENDED, AGENT]
    order: >-
      Analyze {issues} of {story}: read the code each names, write its plan, its size and what only the operator can
      decide, and end with your outcome.
    models: {claude: claude-opus-5-5, codex: gpt-6.1-sol}
  Under estimation:
    from: [Analyzed]
    done: Estimated
    per: repository
    modes: [UNATTENDED, AGENT]
    order: >-
      Estimate {issues} of {story}: read each issue's plan and the code it names, set its size (XS to XL) against the
      measured velocity, name what makes it uncertain, and end with your outcome.
    models: {claude: claude-opus-5-5, codex: gpt-6.1-sol}
  Implementing:
    from: [Backlog, Rework]
    done: Review
    then: Reading
    per: repository
    modes: [UNATTENDED, AGENT]
    order: >-
      Build {issues} of {story} as each issue's plan says: each test red first, then green; commit, and end with your
      outcome.
    models: {codex: gpt-6.1-sol, claude: claude-opus-5-5}
  Reading:
    from: [Implementing, Reworking, Review]
    done: Review
    blocked: Reworking
    per: repository
    modes: [UNATTENDED]
    order: >-
      Read the changes {tasks} made for {issues} of {story}, change nothing, and end with one Findings: block, one
      finding a line: <n>. <blocking|note> | <file or -> | <line or -> | <text>.
    models: {agy: gemini-4-argon-high}
  Reworking:
    from: [Reading]
    done: Review
    then: Reading
    per: repository
    modes: [UNATTENDED, AGENT]
    order: >-
      Fix the blocking findings the reading of {issues} of {story} gave, each with a test seen to fail first; commit,
      and end with your outcome.
    models: {codex: gpt-6.1-sol, claude: claude-opus-5-5}
